server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve at request time so UI startup and backend recreation are independent.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $ollama_backend ollama:11434;

    # Serve the UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy ollama.com search (for browsing available models)
    location /ollama-search {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://ollama.com/search$is_args$args;
        proxy_set_header Host ollama.com;
        proxy_set_header Accept text/html;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy ollama.com library (for model tag pages)
    location /ollama-library/ {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_pass https://ollama.com/library/;
        proxy_set_header Host ollama.com;
        proxy_set_header Accept text/html;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Proxy Ollama API requests
    # System One and other OpenAI-compatible endpoints use /v1/, not /api/.
    location /v1/ {
        proxy_pass http://$ollama_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        client_max_body_size 32m;
    }

    location /api/ {
        proxy_pass http://$ollama_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        # Support streaming responses
        chunked_transfer_encoding on;
    }
}
